<svg class="hero-illo" viewBox="-21 277 642 376" width="100%" role="img" aria-label="Illustration of a GPU package: the die with its compute tiles, six HBM stacks, and traces leaving the substrate" xmlns="http://www.w3.org/2000/svg">
<style>svg{
  --bg:            #FFFFFF;
  --bg-2:          #F5F7FA;
  --surface:       #FFFFFF;
  --surface-2:     #F0F3F7;
  --line:          rgba(14,20,32,0.10);
  --line-strong:   rgba(14,20,32,0.20);
  --text:          #0E1420;
  --text-2:        #4B5563;
  --text-3:        #667085;
  --accent:        #1959FF;
  --accent-hover:  #1147D6;
  --accent-text:   #1147D6;
  --accent-soft:   rgba(25,89,255,0.09);
  --accent-ring:   rgba(25,89,255,0.35);
  --ok:            #047857;
  --warn:          #B45309;
  --terminal-bg:   #0E1420;
  --terminal-line: rgba(255,255,255,0.10);
  --shadow-card:   0 1px 2px rgba(14,20,32,0.04);
  --shadow-panel:  0 24px 60px rgba(14,20,32,0.14);
  --nav-bg:        rgba(255,255,255,0.82);
  --watermark:     rgba(14,20,32,0.045);
  --color-scheme:  light;
background:#FFFFFF}/* ---------- 7b. Hero illustration (inline SVG, token-driven) ------------ */
.hero-illo { display: block; width: 100%; height: auto; overflow: visible; }
.hero-illo .glow-in  { stop-color: var(--accent); stop-opacity: .22; }
.hero-illo .glow-out { stop-color: var(--accent); stop-opacity: 0; }
.hero-illo .trace { stroke: var(--line-strong); stroke-width: 1; fill: none; }
.hero-illo .trace.flow { stroke: var(--accent-text); stroke-width: 1.4; stroke-dasharray: 3 9; stroke-linecap: round; animation: illo-flow 1.6s linear infinite; }
.hero-illo .pad { fill: var(--line-strong); }
.hero-illo .substrate .face-t { fill: var(--surface-2); stroke: var(--text-3); stroke-opacity: .55; stroke-width: 1; }
.hero-illo .substrate .face-l { fill: var(--surface); stroke: var(--text-3); stroke-opacity: .55; stroke-width: 1; }
.hero-illo .substrate .face-r { fill: var(--bg-2); stroke: var(--text-3); stroke-opacity: .55; stroke-width: 1; }
.hero-illo .interposer { fill: none; stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 5; }
.hero-illo .hbm .face-t { fill: var(--surface); stroke: var(--text-3); stroke-opacity: .6; stroke-width: 1; }
.hero-illo .hbm .face-l { fill: var(--surface-2); stroke: var(--text-3); stroke-opacity: .6; stroke-width: 1; }
.hero-illo .hbm .face-r { fill: var(--bg-2); stroke: var(--text-3); stroke-opacity: .6; stroke-width: 1; }
.hero-illo .hbm-layer { stroke: var(--line-strong); stroke-width: 1; opacity: .7; }
.hero-illo .die .face-t { fill: var(--accent-soft); stroke: var(--accent-text); stroke-width: 1; }
.hero-illo .die .face-l { fill: var(--surface-2); stroke: var(--accent-ring); stroke-width: 1; }
.hero-illo .die .face-r { fill: var(--bg-2); stroke: var(--accent-ring); stroke-width: 1; }
.hero-illo .tile { fill: var(--accent); fill-opacity: .28; stroke: var(--accent-text); stroke-width: .5; stroke-opacity: .6; }
.hero-illo .tile.pulse { animation: illo-tile 2.6s ease-in-out infinite; }
@keyframes illo-flow { to { stroke-dashoffset: -12; } }
@keyframes illo-tile { 0%, 100% { fill-opacity: .28; } 50% { fill-opacity: .62; } }
@media (prefers-reduced-motion: reduce) { .hero-illo .flow, .hero-illo .pulse { animation: none; } }

</style>
