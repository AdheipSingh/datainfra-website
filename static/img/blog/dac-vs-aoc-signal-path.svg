<svg width="680" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="320" rx="12" fill="#141420"/>

<text x="340" y="22" text-anchor="middle" font-size="12" fill="#8a8980">One link, two builds &#8212; count the active components between the two SerDes</text>

<!-- passive DAC lane -->
<text x="18" y="50" font-size="11" font-weight="700" fill="#39d2c0" letter-spacing="0.5">PASSIVE DAC</text>
<rect x="18" y="60" width="150" height="46" rx="8" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="93" y="78" text-anchor="middle" font-size="11" fill="#e0dfd8">ConnectX SerDes</text>
<text x="93" y="94" text-anchor="middle" font-size="10" fill="#6e7681">100G-PAM4 lanes</text>

<line x1="168" y1="83" x2="492" y2="83" stroke="#39d2c0" stroke-width="5" stroke-linecap="round"/>
<text x="330" y="70" text-anchor="middle" font-size="10" fill="#39d2c0">copper twinax &#8212; no conversion, no retiming</text>
<text x="330" y="101" text-anchor="middle" font-size="10" fill="#8a8980">0 W drawn by the cable</text>

<rect x="492" y="60" width="150" height="46" rx="8" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="567" y="78" text-anchor="middle" font-size="11" fill="#e0dfd8">Switch SerDes</text>
<text x="567" y="94" text-anchor="middle" font-size="10" fill="#6e7681">Quantum / Spectrum</text>

<line x1="18" y1="130" x2="662" y2="130" stroke="#30363d" stroke-width="1"/>

<!-- optical lane -->
<text x="18" y="158" font-size="11" font-weight="700" fill="#bc8cff" letter-spacing="0.5">AOC OR TRANSCEIVER PAIR</text>
<rect x="18" y="170" width="116" height="46" rx="8" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="76" y="188" text-anchor="middle" font-size="11" fill="#e0dfd8">NIC SerDes</text>
<text x="76" y="204" text-anchor="middle" font-size="10" fill="#6e7681">electrical</text>

<line x1="134" y1="193" x2="156" y2="193" stroke="#8a8980" stroke-width="1.2" marker-end="url(#ar)"/>

<rect x="156" y="170" width="116" height="46" rx="8" fill="#1a1930" stroke="#bc8cff" stroke-width="0.8"/>
<text x="214" y="188" text-anchor="middle" font-size="11" fill="#bc8cff">DSP + laser</text>
<text x="214" y="204" text-anchor="middle" font-size="10" fill="#8b8cf5">electrical &#8594; optical</text>

<line x1="272" y1="193" x2="388" y2="193" stroke="#bc8cff" stroke-width="2" stroke-dasharray="6 4"/>
<text x="330" y="182" text-anchor="middle" font-size="10" fill="#8a8980">fibre</text>

<rect x="388" y="170" width="116" height="46" rx="8" fill="#1a1930" stroke="#bc8cff" stroke-width="0.8"/>
<text x="446" y="188" text-anchor="middle" font-size="11" fill="#bc8cff">PD + DSP</text>
<text x="446" y="204" text-anchor="middle" font-size="10" fill="#8b8cf5">optical &#8594; electrical</text>

<line x1="504" y1="193" x2="526" y2="193" stroke="#8a8980" stroke-width="1.2" marker-end="url(#ar)"/>

<rect x="526" y="170" width="116" height="46" rx="8" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="584" y="188" text-anchor="middle" font-size="11" fill="#e0dfd8">Switch SerDes</text>
<text x="584" y="204" text-anchor="middle" font-size="10" fill="#6e7681">electrical</text>

<rect x="156" y="226" width="348" height="24" rx="6" fill="#28200e" stroke="#c07818" stroke-width="0.6"/>
<text x="330" y="238" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#e0a840">two powered, heat-producing, individually failable ends</text>

<line x1="18" y1="272" x2="662" y2="272" stroke="#30363d" stroke-width="1"/>
<text x="18" y="292" font-size="10" fill="#8a8980">The DSP is also where the extra nanoseconds live &#8212; but on a fabric with microsecond end-to-end latency,</text>
<text x="18" y="307" font-size="10" fill="#8a8980">power, cost and one fewer failure domain per link are the arguments that actually decide the build.</text>
</svg>
