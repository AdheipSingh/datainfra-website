<svg width="680" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="400" rx="12" fill="#141420"/>

<text x="340" y="22" text-anchor="middle" font-size="12" fill="#8a8980">Reach of each cable class vs. the path length you actually route in a rack</text>

<!-- routed-path band: 2.0 m to 3.5 m -->
<rect x="280" y="44" width="90" height="246" fill="#d29922" opacity="0.10"/>
<line x1="280" y1="44" x2="280" y2="290" stroke="#d29922" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
<line x1="370" y1="44" x2="370" y2="290" stroke="#d29922" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
<text x="325" y="39" text-anchor="middle" font-size="10" fill="#d29922">routed path in a 42U rack</text>

<!-- row 1: passive DAC NDR -->
<text x="18" y="56" font-size="11" font-weight="600" fill="#e0dfd8">Passive DAC</text>
<text x="18" y="70" font-size="10" fill="#6e7681">NDR 400G / 800G</text>
<rect x="160" y="52" width="90" height="20" rx="4" fill="#39d2c0" opacity="0.75"/>
<text x="258" y="62" dominant-baseline="central" font-size="10" fill="#39d2c0">1.5 m max &#183; 0 W &#183; parts at 0.5 / 1 / 1.5 m</text>

<!-- row 2: passive DAC HDR -->
<text x="18" y="101" font-size="11" font-weight="600" fill="#e0dfd8">Passive DAC</text>
<text x="18" y="115" font-size="10" fill="#6e7681">HDR 200G</text>
<rect x="160" y="97" width="120" height="20" rx="4" fill="#39d2c0" opacity="0.6"/>
<text x="288" y="107" dominant-baseline="central" font-size="10" fill="#39d2c0">2 m max &#183; 0 W</text>

<!-- row 3: passive DAC EDR -->
<text x="18" y="146" font-size="11" font-weight="600" fill="#e0dfd8">Passive DAC</text>
<text x="18" y="160" font-size="10" fill="#6e7681">EDR 100G (25G-NRZ)</text>
<rect x="160" y="142" width="300" height="20" rx="4" fill="#39d2c0" opacity="0.4"/>
<text x="468" y="152" dominant-baseline="central" font-size="10" fill="#1a9e7a">5 m &#8212; the legacy number</text>

<!-- row 4: active copper -->
<text x="18" y="191" font-size="11" font-weight="600" fill="#e0dfd8">Active copper</text>
<text x="18" y="205" font-size="10" fill="#6e7681">ACC / LACC</text>
<rect x="160" y="187" width="180" height="20" rx="4" fill="#58a6ff" opacity="0.7"/>
<rect x="340" y="187" width="120" height="20" rx="4" fill="#58a6ff" opacity="0.25"/>
<text x="468" y="197" dominant-baseline="central" font-size="10" fill="#58a6ff">3&#8211;5 m &#183; ~1.5&#8211;4 W per cable</text>

<!-- row 5: AOC / optics -->
<text x="18" y="236" font-size="11" font-weight="600" fill="#e0dfd8">AOC / transceivers</text>
<text x="18" y="250" font-size="10" fill="#6e7681">MMF and SMF</text>
<rect x="160" y="232" width="470" height="20" rx="4" fill="#bc8cff" opacity="0.55"/>
<line x1="630" y1="242" x2="652" y2="242" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowR)"/>
<text x="400" y="242" dominant-baseline="central" text-anchor="middle" font-size="10" fill="#e0dfd8">100 m multimode &#183; 500 m&#8211;10 km single mode &#183; watts at both ends</text>

<!-- axis -->
<line x1="160" y1="290" x2="652" y2="290" stroke="#6e7681" stroke-width="1"/>
<g font-size="10" fill="#6e7681" text-anchor="middle">
<line x1="160" y1="290" x2="160" y2="296" stroke="#6e7681"/><text x="160" y="310">0</text>
<line x1="220" y1="290" x2="220" y2="296" stroke="#6e7681"/><text x="220" y="310">1</text>
<line x1="280" y1="290" x2="280" y2="296" stroke="#6e7681"/><text x="280" y="310">2</text>
<line x1="340" y1="290" x2="340" y2="296" stroke="#6e7681"/><text x="340" y="310">3</text>
<line x1="400" y1="290" x2="400" y2="296" stroke="#6e7681"/><text x="400" y="310">4</text>
<line x1="460" y1="290" x2="460" y2="296" stroke="#6e7681"/><text x="460" y="310">5</text>
<line x1="520" y1="290" x2="520" y2="296" stroke="#6e7681"/><text x="520" y="310">6</text>
<line x1="580" y1="290" x2="580" y2="296" stroke="#6e7681"/><text x="580" y="310">7</text>
<line x1="640" y1="290" x2="640" y2="296" stroke="#6e7681"/><text x="640" y="310">8</text>
</g>
<text x="406" y="330" text-anchor="middle" font-size="10" fill="#8a8980">cable length (metres)</text>

<line x1="18" y1="352" x2="662" y2="352" stroke="#30363d" stroke-width="1"/>
<text x="18" y="372" font-size="10" fill="#8a8980">Every SerDes jump &#8212; 25G-NRZ, 50G-PAM4, 100G-PAM4 &#8212; costs passive copper reach.</text>
<text x="18" y="387" font-size="10" fill="#6e7681">Source: NVIDIA LinkX DAC/ACC catalogue and LinkX key-technologies documentation.</text>
</svg>
