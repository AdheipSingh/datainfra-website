<svg width="680" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>

<rect x="0" y="0" width="680" height="380" rx="12" fill="#141420"/>
<text x="340" y="22" text-anchor="middle" font-size="12" fill="#8a8980">Four NCCL elephant flows, four uplinks, one deterministic hash</text>

<!-- flows -->
<g>
<rect x="16" y="56" width="92" height="26" rx="5" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="62" y="69" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#e0dfd8">flow A</text>
<rect x="16" y="94" width="92" height="26" rx="5" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="62" y="107" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#e0dfd8">flow B</text>
<rect x="16" y="132" width="92" height="26" rx="5" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="62" y="145" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#e0dfd8">flow C</text>
<rect x="16" y="170" width="92" height="26" rx="5" fill="#1e1e2e" stroke="#8a8980" stroke-width="0.5"/>
<text x="62" y="183" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#e0dfd8">flow D</text>
</g>

<!-- hash box -->
<rect x="140" y="86" width="86" height="80" rx="8" fill="#1a1930" stroke="#7b70e0" stroke-width="0.8"/>
<text x="183" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#a99ef5">hash</text>
<text x="183" y="128" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#8a8980">5-tuple</text>
<text x="183" y="144" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#8a8980">mod 4</text>
<g stroke="#6e7681" stroke-width="0.9">
<line x1="108" y1="69" x2="140" y2="100"/>
<line x1="108" y1="107" x2="140" y2="115"/>
<line x1="108" y1="145" x2="140" y2="135"/>
<line x1="108" y1="183" x2="140" y2="152"/>
</g>

<!-- uplinks -->
<g font-size="10">
<line x1="226" y1="120" x2="300" y2="62" stroke="#f85149" stroke-width="2.2" marker-end="url(#a2)"/>
<line x1="226" y1="120" x2="300" y2="62" stroke="#f85149" stroke-width="2.2" stroke-dasharray="4 4"/>
<line x1="226" y1="120" x2="300" y2="112" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a2)"/>
<line x1="226" y1="120" x2="300" y2="212" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a2)"/>
</g>

<!-- uplink bars: 0..3 -->
<g>
<text x="312" y="54" font-size="10" fill="#8a8980">uplink 0</text>
<rect x="312" y="60" width="240" height="18" rx="4" fill="#1e1e2e" stroke="#30363d" stroke-width="0.6"/>
<rect x="312" y="60" width="240" height="18" rx="4" fill="#f85149" opacity="0.65"/>
<text x="562" y="70" dominant-baseline="central" font-size="10" fill="#f85149">2 flows &#183; 200%</text>

<text x="312" y="104" font-size="10" fill="#8a8980">uplink 1</text>
<rect x="312" y="110" width="240" height="18" rx="4" fill="#1e1e2e" stroke="#30363d" stroke-width="0.6"/>
<rect x="312" y="110" width="120" height="18" rx="4" fill="#3fb950" opacity="0.6"/>
<text x="562" y="120" dominant-baseline="central" font-size="10" fill="#3fb950">1 flow &#183; 100%</text>

<text x="312" y="154" font-size="10" fill="#8a8980">uplink 2</text>
<rect x="312" y="160" width="240" height="18" rx="4" fill="#1e1e2e" stroke="#30363d" stroke-width="0.6"/>
<text x="562" y="170" dominant-baseline="central" font-size="10" fill="#6e7681">idle &#183; 0%</text>

<text x="312" y="204" font-size="10" fill="#8a8980">uplink 3</text>
<rect x="312" y="210" width="240" height="18" rx="4" fill="#1e1e2e" stroke="#30363d" stroke-width="0.6"/>
<rect x="312" y="210" width="120" height="18" rx="4" fill="#3fb950" opacity="0.6"/>
<text x="562" y="220" dominant-baseline="central" font-size="10" fill="#3fb950">1 flow &#183; 100%</text>
</g>

<line x1="16" y1="252" x2="664" y2="252" stroke="#30363d" stroke-width="1"/>

<rect x="16" y="268" width="200" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="116" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#e0a840">9.4%</text>
<text x="116" y="312" text-anchor="middle" font-size="10" fill="#8a8980">chance the hash spreads</text>
<text x="116" y="326" text-anchor="middle" font-size="10" fill="#8a8980">4 flows over 4 uplinks</text>
<text x="116" y="348" text-anchor="middle" font-size="10" fill="#6e7681">uniform hash, 4!/4&#8308;</text>

<text x="240" y="288" font-size="11" font-weight="600" fill="#e0dfd8">The collective runs at the speed of uplink 0</text>
<text x="240" y="310" font-size="10" fill="#8a8980">AllReduce is bulk-synchronous. Every rank waits for the last</text>
<text x="240" y="326" font-size="10" fill="#8a8980">byte, so a single 2x-oversubscribed uplink doubles the step</text>
<text x="240" y="342" font-size="10" fill="#8a8980">time while a quarter of the fabric sits idle. Averages do not</text>
<text x="240" y="358" font-size="10" fill="#8a8980">describe a collective; the maximum does.</text>
</svg>
