<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="630" fill="#0d1117"/>

<!-- Subtle grid -->
<g opacity="0.04">
<line x1="60" y1="0" x2="60" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="120" y1="0" x2="120" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="180" y1="0" x2="180" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="240" y1="0" x2="240" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="300" y1="0" x2="300" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="360" y1="0" x2="360" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="420" y1="0" x2="420" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="480" y1="0" x2="480" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="540" y1="0" x2="540" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="600" y1="0" x2="600" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="660" y1="0" x2="660" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="720" y1="0" x2="720" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="780" y1="0" x2="780" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="840" y1="0" x2="840" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="900" y1="0" x2="900" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="960" y1="0" x2="960" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="1020" y1="0" x2="1020" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="1080" y1="0" x2="1080" y2="630" stroke="#6e7681" stroke-width="0.5"/>
<line x1="1140" y1="0" x2="1140" y2="630" stroke="#6e7681" stroke-width="0.5"/>
</g>

<text x="60" y="66" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Four equal-cost uplinks, four elephant flows, one deterministic hash</text>

<!-- uplink bars -->
<text x="60" y="122" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3">uplink 0</text>
<rect x="200" y="106" width="640" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
<rect x="200" y="106" width="640" height="24" rx="5" fill="#f85149" opacity="0.65"/>
<text x="864" y="123" font-family="system-ui,sans-serif" font-size="14" fill="#f85149">2 flows &#183; 200% offered</text>

<text x="60" y="172" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3">uplink 1</text>
<rect x="200" y="156" width="640" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
<rect x="200" y="156" width="320" height="24" rx="5" fill="#3fb950" opacity="0.6"/>
<text x="864" y="173" font-family="system-ui,sans-serif" font-size="14" fill="#3fb950">1 flow &#183; 100%</text>

<text x="60" y="222" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3">uplink 2</text>
<rect x="200" y="206" width="640" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
<text x="864" y="223" font-family="system-ui,sans-serif" font-size="14" fill="#6e7681">idle</text>

<text x="60" y="272" font-family="system-ui,sans-serif" font-size="14" fill="#e6edf3">uplink 3</text>
<rect x="200" y="256" width="640" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
<rect x="200" y="256" width="320" height="24" rx="5" fill="#3fb950" opacity="0.6"/>
<text x="864" y="273" font-family="system-ui,sans-serif" font-size="14" fill="#3fb950">1 flow &#183; 100%</text>

<text x="60" y="330" font-family="system-ui,sans-serif" font-size="15" fill="#e0a840">9.4% chance a uniform hash spreads four flows over four uplinks</text>

<!-- Tags -->
<rect x="60" y="374" width="110" height="28" rx="14" fill="#58a6ff" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<text x="115" y="392" font-family="system-ui,sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600" letter-spacing="0.5">NETWORKING</text>

<rect x="185" y="374" width="110" height="28" rx="14" fill="#39d2c0" stroke="#39d2c0" stroke-width="0.8" opacity="0.3"/>
<text x="240" y="392" font-family="system-ui,sans-serif" font-size="11" fill="#39d2c0" text-anchor="middle" font-weight="600" letter-spacing="0.5">INFINIBAND</text>

<rect x="310" y="374" width="70" height="28" rx="14" fill="#bc8cff" stroke="#bc8cff" stroke-width="0.8" opacity="0.3"/>
<text x="345" y="392" font-family="system-ui,sans-serif" font-size="11" fill="#bc8cff" text-anchor="middle" font-weight="600" letter-spacing="0.5">RDMA</text>

<!-- Title -->
<text x="60" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">ECMP hash collisions in a fat-tree:</text>
<text x="60" y="502" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">too few flows, not too many</text>

<!-- Brand -->
<text x="60" y="570" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#6e7681">baaz.dev</text>
<text x="1140" y="570" font-family="monospace" font-size="11" fill="#6e7681" text-anchor="end">AI collectives have low entropy, and ECMP needs entropy</text>
</svg>
