<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="round"><rect width="1200" height="630" rx="0"/></clipPath>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="0" cy="0" r="0.8" fill="#6e7681" opacity="0.04"/>
  </pattern>
</defs>
<rect width="1200" height="630" fill="#0d1117" clip-path="url(#round)"/>
<rect width="1200" height="630" fill="url(#dots)"/>

<!-- reach-comparison motif: three cable classes, increasing reach -->
<text x="60" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#6e7681" letter-spacing="0.5">REACH BY CABLE CLASS · NDR 800G</text>

<!-- Passive DAC (teal, short) -->
<circle cx="70" cy="150" r="7" fill="#39d2c0"/>
<line x1="70" y1="150" x2="330" y2="150" stroke="#39d2c0" stroke-width="6" stroke-linecap="round"/>
<rect x="330" y="140" width="20" height="20" rx="3" fill="#39d2c0"/>
<text x="70" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Passive DAC</text>
<text x="372" y="156" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#39d2c0">1.5 m</text>

<!-- Active copper (amber, medium) -->
<circle cx="70" cy="228" r="7" fill="#d29922"/>
<line x1="70" y1="228" x2="530" y2="228" stroke="#d29922" stroke-width="6" stroke-linecap="round"/>
<rect x="530" y="218" width="20" height="20" rx="3" fill="#d29922"/>
<text x="70" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Active copper (ACC)</text>
<text x="572" y="234" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#d29922">3 m</text>

<!-- Optics / AOC (blue, long) -->
<circle cx="70" cy="306" r="7" fill="#58a6ff"/>
<line x1="70" y1="306" x2="1040" y2="306" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/>
<rect x="1040" y="296" width="20" height="20" rx="3" fill="#58a6ff"/>
<text x="70" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Optics (AOC)</text>
<text x="1082" y="312" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#58a6ff">100 m+</text>

<line x1="60" y1="360" x2="1140" y2="360" stroke="#21262d" stroke-width="1"/>

<!-- category + title -->
<rect x="60" y="430" width="104" height="28" rx="14" fill="#58a6ff" opacity="0.15"/>
<rect x="60" y="430" width="104" height="28" rx="14" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4"/>
<text x="112" y="448" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle" letter-spacing="0.5">NETWORKING</text>
<text x="60" y="480" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">DAC, ACC or AOC: Cabling GPU Nodes to</text>
<text x="60" y="516" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">the Switch in the Same Rack</text>
<text x="60" y="590" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#6e7681">baaz.dev</text>
</svg>
